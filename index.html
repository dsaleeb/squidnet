<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squidnet</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#0d1018;--surface:#141720;--surface2:#1c2030;--border:#252a40;
  --fg:#dce4f5;--fg-dim:#6a7595;--accent:#f2549c;--brand:#f2549c;--danger:#ef5350;--warn:#ffca28;--ok:#66bb6a;--accent-ink:#1a0610;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f8;--surface:#ffffff;--surface2:#e4e9f5;--border:#c8cfe0;
    --fg:#1a2040;--fg-dim:#5a6080;--accent:#c92678;--brand:#c92678;--danger:#c62828;--warn:#b26a00;--ok:#2e7d32;--accent-ink:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1f8;--surface:#ffffff;--surface2:#e4e9f5;--border:#c8cfe0;
  --fg:#1a2040;--fg-dim:#5a6080;--accent:#c92678;--brand:#c92678;--danger:#c62828;--warn:#b26a00;--ok:#2e7d32;--accent-ink:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px 'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button.mini{padding:2px 7px;font-size:12px}
button.icon{padding:2px 6px;font-size:12px;line-height:1.2}
button.on{border-color:var(--accent);color:var(--accent);background:var(--bg)}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px;min-width:0}
textarea{width:100%;resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=color]{padding:0 2px;width:30px;height:26px;flex:none}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* header */
header.bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:7px;font:700 15px system-ui,'Segoe UI',sans-serif;letter-spacing:.01em;color:var(--brand);margin-right:4px}
.sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.grow{flex:1}
.mbtn{background:transparent;border-color:transparent}
.mbtn:hover,.mbtn.open{background:var(--surface2);border-color:var(--border)}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:5px 0 0 5px;margin-left:0}
.seg button:last-child{border-radius:0 5px 5px 0}
#find{width:220px}
/* layout */
main{flex:1;display:flex;min-height:0}
aside{flex:none;display:flex;flex-direction:column;background:var(--surface);min-height:0}
#left{width:236px;overflow:auto;padding:8px}
#right{width:350px}
.split{flex:none;width:6px;cursor:col-resize;background:var(--border);background-clip:content-box;padding:0 2px;border:0;touch-action:none}
.split:hover,.split.drag,.split:focus-visible{background:var(--accent);background-clip:content-box;padding:0 1px;outline:none}
body.noleft #splitL,body.noright #splitR{display:none}
.ltl{font-size:12px;color:var(--fg-dim);margin-left:2px}
body.noleft #left,body.noright #right{display:none}
.ph{font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin:10px 2px 6px;display:flex;align-items:center;gap:6px}
.ph:first-child{margin-top:2px}
#shapeq,#navq{width:100%;margin-bottom:6px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.shape{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);cursor:grab;font-size:11px;text-align:center;line-height:1.2;user-select:none}
.shape:hover{border-color:var(--accent)}
.shape svg{width:26px;height:26px}
.cat{grid-column:1/-1;font-size:11px;color:var(--fg-dim);margin:6px 2px 0}
.gens{display:flex;flex-direction:column;gap:4px}
.gens button{text-align:left}
.nav{display:flex;flex-direction:column;gap:1px}
.navi{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;font:12px 'IBM Plex Mono',monospace;border:1px solid transparent}
.navi:hover{background:var(--bg)}
.navi.on{border-color:var(--accent);background:var(--bg)}
.navi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .meta{color:var(--fg-dim);font-size:10.5px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
/* right panel */
.tabs{display:flex;border-bottom:1px solid var(--border);flex:none}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 4px;color:var(--fg-dim);border-bottom:2px solid transparent;font-weight:600;font-size:12px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#side{flex:1;overflow:auto;padding:10px}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:10px}
.card.sub{background:var(--bg)}
.card h3{margin:0 0 8px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);display:flex;align-items:center;gap:6px}
.card h3 .grow{flex:1}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row>label{width:86px;flex:none;color:var(--fg-dim);font-size:12px}
.row>input:not([type=checkbox]):not([type=color]),.row>select,.row>textarea{flex:1}
.grid{display:grid;gap:4px;align-items:center}
.grid input,.grid select{width:100%}
.hint{color:var(--fg-dim);font-size:11.5px;line-height:1.45;margin:4px 0 8px}
.hint kbd,.kbd{font:11px 'IBM Plex Mono',monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font:11px 'IBM Plex Mono',monospace;border:1px solid var(--border);border-radius:12px;padding:2px 8px;cursor:pointer;user-select:none;background:var(--bg)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.chk{padding:6px 8px;border-radius:5px;margin-bottom:4px;cursor:pointer;font-size:12px;border:1px solid var(--border);background:var(--bg)}
.chk:hover{border-color:var(--accent)}
.chk.error{border-left:3px solid var(--danger)}
.chk.warn{border-left:3px solid var(--warn)}
.chk.info{border-left:3px solid var(--fg-dim)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:15px;text-align:center;margin-left:3px}
.badge.w{background:var(--warn);color:#000}
/* stage */
#stagewrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg);touch-action:none}
#mainsvg,#mainsvg svg,#ovl{position:absolute;inset:0;width:100%;height:100%;display:block}
#mainsvg svg{user-select:none}
#ovl{pointer-events:none}
#stage.t-select #mainsvg svg{cursor:default}
#stage.t-hand #mainsvg svg,#stage.panning #mainsvg svg{cursor:grab}
#stage.t-link #mainsvg svg{cursor:crosshair}
#stage.t-select [data-dev],#stage.t-select [data-note]{cursor:move}
#stage.t-select [data-port]{cursor:crosshair}
#stage [data-link]{cursor:pointer}
#stage.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
#mini{position:absolute;right:12px;bottom:12px;width:170px;height:110px;opacity:.92;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer}
body.nomini #mini{display:none}
.zoombtns{position:absolute;left:12px;bottom:12px;display:flex;gap:4px}
.zoombtns button{background:var(--surface)}
/* footer */
footer{display:flex;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid var(--border);background:var(--surface);font:11px 'IBM Plex Mono',monospace;color:var(--fg-dim);flex-wrap:wrap}
#pages{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
#pages button{font-size:12px;padding:3px 10px}
/* popups */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:4px;min-width:210px;box-shadow:0 8px 28px rgba(0,0,0,.35);max-height:80vh;overflow:auto}
.pop .it{display:flex;justify-content:space-between;gap:18px;padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.pop .it:hover{background:var(--surface2)}
.pop .it.dis{opacity:.4;pointer-events:none}
.pop .it .k{color:var(--fg-dim);font:11px 'IBM Plex Mono',monospace}
.pop .hr{height:1px;background:var(--border);margin:4px 2px}
.pop .hd{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--fg-dim);padding:6px 10px 2px;text-transform:uppercase}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600}
.mhead span{flex:1}
#mbody{padding:14px;overflow:auto}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);color:var(--fg);padding:7px 14px;border-radius:6px;z-index:70;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
table.sc{width:100%;border-collapse:collapse;font-size:12px}
.vov{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column}
.vhead{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.vtitle{font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtabs{display:flex;gap:3px;flex-wrap:wrap}
.vbody{flex:1;display:flex;min-height:0}
.vstage{flex:1;position:relative;overflow:hidden;background:#e9ecf2;cursor:grab;touch-action:none}
.vstage > svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.vstage [data-vs]{cursor:pointer}
.vmsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--surface);color:var(--fg);border:1px solid var(--warn);border-radius:8px;padding:14px 18px;max-width:520px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.vside{width:300px;flex:none;overflow:auto;padding:10px;border-left:1px solid var(--border);background:var(--surface)}
@media (max-width:820px){.vbody{flex-direction:column}.vside{width:auto;height:35%;border-left:0;border-top:1px solid var(--border)}}
table.sc td{padding:3px 6px;border-bottom:1px solid var(--border)}
@media (max-width:1100px){#left{width:200px}#right{width:300px}}
@media (max-width:820px){
  main{flex-direction:column}
  #left{width:auto!important;max-height:140px;border-bottom:1px solid var(--border)}
  .split{display:none}
  #right{width:auto!important;height:42%;border-top:1px solid var(--border)}
  #find{width:120px}#mini{display:none}
}
</style>
</head>
<body>
<header class="bar">
  <span class="brand"><span id="brandMark"></span>Squidnet</span>
  <div id="menus" style="display:flex;gap:2px"></div>
  <span class="sep"></span>
  <div class="seg" id="tools">
    <button data-tool="select" title="Select / move (V)">⬚ Select</button>
    <button data-tool="link" title="Draw links between devices (L)">⟋ Link</button>
    <button data-tool="hand" title="Pan (H, or hold Space)">✋ Pan</button>
  </div>
  <label for="ltype" class="ltl" title="Type given to links you draw on the canvas (port-drag or Link tool). Change an existing link's type in the Format panel.">New links:</label>
  <select id="ltype" title="Type given to links you draw on the canvas (port-drag or Link tool). Change an existing link's type in the Format panel."></select>
  <span class="sep"></span>
  <button id="bUndo" class="icon" title="Undo (Ctrl+Z)">↶</button>
  <button id="bRedo" class="icon" title="Redo (Ctrl+Y)">↷</button>
  <span class="grow"></span>
  <input id="find" placeholder="Find device, IP, port… (Ctrl+F)" aria-label="Find">
  <button id="bTheme" class="mini" title="Toggle light / dark theme">Theme</button>
</header>
<main>
  <aside id="left"></aside>
  <div class="split" id="splitL" role="separator" aria-orientation="vertical" aria-label="Resize shapes panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
  <div id="stagewrap">
    <div id="stage" class="t-select"><div id="mainsvg"></div><svg id="ovl" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <canvas id="mini" width="400" height="260" title="Overview — click or drag to navigate"></canvas>
    <div class="zoombtns">
      <button id="zOut" title="Zoom out">－</button><button id="zPct" title="Reset to 100%">100%</button><button id="zIn" title="Zoom in">＋</button><button id="zFit" title="Fit page (Ctrl+Shift+H)">Fit</button>
    </div>
  </div>
  <div class="split" id="splitR" role="separator" aria-orientation="vertical" aria-label="Resize format panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
  <aside id="right"><div class="tabs" id="tabs"></div><div id="side"></div></aside>
</main>
<footer><div id="pages"></div><span class="grow"></span><span id="stat"></span></footer>
<div id="menu" class="pop" hidden></div>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><span id="mtitle"></span><button id="mclose" class="icon" aria-label="Close">✕</button></div><div id="mbody"></div></div></div>
<input type="file" id="file" accept=".json,.html,.htm,.csv,.txt,.vsdx,.vsdm,.vsd,.vdx,application/json,text/html,text/csv" hidden>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════ */

const SPEEDS = ['', '100M', '1G', '2.5G', '10G', '25G', '40G', '50G', '100G', '200G', '400G', '800G'];
const SWATCH = ['#4fc3f7','#5c8df6','#ab47bc','#66bb6a','#ff7043','#ef5350','#26c6da','#ffca28','#ec407a','#8d6e63','#9ccc65','#7e57c2'];

/* palette: shapes the user can drag onto the canvas */
const SHAPES = [
  {cat:'Network', label:'Switch 24-port', type:'switch', rows:2, groups:[{label:'Access',ports:'1-24',speed:'1G'},{label:'Uplink',ports:'25-28',speed:'10G'}]},

  {cat:'Network', label:'Firewall', type:'firewall', view:'icon'},

function tableModel(doc, page, links, M, I) {

/* Lay out new devices on their own, then drop them to the right of what is already on the page */
function placeNew(doc, page, devs, links, zones) {
  const existing = page.devices.slice();
  const tmp = normPage({devices: devs, links, zones: [], notes: []}, doc);
  autoLayout(doc, tmp);
  if (existing.length) {
    const {M} = measureAll(doc, page);
    const maxX = Math.max(...existing.map(d => d.x + (M[d.id] ? M[d.id].w : 100)));
    const minY = Math.min(...existing.map(d => d.y));
    const nMinX = Math.min(...devs.map(d => d.x)), nMinY = Math.min(...devs.map(d => d.y));
    devs.forEach(d => { d.x += maxX + 160 - nMinX; d.y += minY - nMinY; });
  }
  page.devices.push(...devs); page.links.push(...links); if (zones) page.zones.push(...zones);
  normPage(page, doc);
}

function genFabric(doc, page, o) {
  const S = Math.max(1, +o.spines || 2), L = Math.max(1, +o.leaves || 2), H = Math.max(0, +o.hosts || 0);
  const ft = ensureLinkType(doc, 'Fabric', '#4fc3f7', 2, '');
  const pt = o.mlag ? ensureLinkType(doc, 'MLAG Peer-link', '#26c6da', 2.5, '8,3') : null;

  const bt = o.border ? ensureLinkType(doc, 'Border / WAN', '#ff7043', 2.5, '') : null;

/* Clone a switch into an MLAG/vPC pair: peer-link + optionally split bond legs across the pair */
function makeMlagPair(doc, page, devId, splitTypes) {
  const d = page.devices.find(x => x.id === devId);
  if (!d) return null;
  const peerT = ensureLinkType(doc, 'MLAG Peer-link', '#26c6da', 2.5, '8,3');
  let peers = [];
  const pg = d.groups.find(g => /peer|isl|mlag|vpc/i.test(g.label));
  if (pg) { const used = usedPorts(page, d.id); peers = parsePorts(pg.ports).filter(p => !used.has(p)).slice(0, 2); }
  if (peers.length < 2) {
    const all = portsOf(d);
    const last = all.length ? all[all.length - 1] : '0';
    const m = String(last).match(/^(.*?)(\d+)$/) || ['', '', '0'];
    peers = [m[1] + (+m[2] + 1), m[1] + (+m[2] + 2)];
    d.groups.push({label: 'Peer', ports: peers.join(','), color: '#26c6da', vlan: '', speed: ''});

  peers.forEach(p => page.links.push(mkLink(d.id, p, c.id, p, peerT, '', {lag: 'peer-link'})));

    const byNb = {};
    page.links.forEach(l => {

      const end = l.a.dev === d.id ? 'a' : l.b.dev === d.id ? 'b' : null;
      if (!end) return;
      const nb = end === 'a' ? l.b.dev : l.a.dev;
      if (nb === c.id) return;

    });

  }
  page.zones.forEach(z => { if (z.devices.includes(d.id)) z.devices.push(c.id); });

}

/* every lower device ↔ every upper device on next free ports */
function meshConnect(page, upper, lower, type, vlans, per, gu, gl) {
  let n = 0;
  lower.forEach(lo => upper.forEach(up => {
    if (lo === up) return;
    for (let k = 0; k < (per || 1); k++) { page.links.push(mkLink(up, nextFree(page, up, gu), lo, nextFree(page, lo, gl), type, vlans || '')); n++; }
  }));
  return n;

/* ════════════════════════════════════════════════════════════════════
   CHECKS  (validation like NetBox / Visio rules)
   ════════════════════════════════════════════════════════════════════ */
function runChecks(doc, page) {
  const out = [], I = idx(doc, page), used = {};
  const add = (level, msg, ids) => out.push({level, msg, ids: ids || []});
  const names = {};
  page.devices.forEach(d => { (names[d.name] = names[d.name] || []).push(d.id); });
  for (const n in names) if (names[n].length > 1) add('warn', `Duplicate device name “${n}” (${names[n].length}×)`, names[n]);
  const undefV = new Set();
  page.links.forEach(l => {
    const da = I.dev[l.a.dev], db = I.dev[l.b.dev];
    if (!da || !db) { add('error', 'Link has a missing endpoint device', [l.id]); return; }
    if (l.a.dev === l.b.dev) add('error', `${da.name}: link connects the device to itself`, [l.id]);
    [[l.a, da], [l.b, db]].forEach(([e, d]) => {
      if (!e.port) { if (hasPorts(d)) add('info', `${d.name}: link to ${(d === da ? db : da).name} has no port assigned`, [l.id]); return; }
      const k = d.id + '|' + e.port;
      (used[k] = used[k] || []).push(l.id);
      if (hasPorts(d)) {
        const g = groupOf(d, e.port);
        if (!g) add('warn', `${d.name}: port ${e.port} is not in any port group`, [l.id, d.id]);
        else {
          if (g.speed && l.speed && g.speed !== l.speed) add('warn', `${d.name} ${e.port}: link speed ${l.speed} ≠ port speed ${g.speed}`, [l.id]);
          const lv = linkVlans(l);
          if (g.vlan && lv.length && !lv.includes(g.vlan)) add('warn', `${d.name} ${e.port}: access VLAN ${g.vlan} not carried by link (VLAN ${compressPorts(lv)})`, [l.id]);
        }
      }
    });
    const ga = hasPorts(da) && groupOf(da, l.a.port), gb = hasPorts(db) && groupOf(db, l.b.port);
    if (ga && gb && ga.speed && gb.speed && ga.speed !== gb.speed && !l.speed) add('warn', `Speed mismatch: ${da.name} ${l.a.port} (${ga.speed}) ↔ ${db.name} ${l.b.port} (${gb.speed})`, [l.id]);
    linkVlans(l).forEach(v => { if (!I.vl[v]) undefV.add(v); });
  });
  for (const k in used) if (used[k].length > 1) { const [dv, ...pp] = k.split('|'); add('error', `${I.dev[dv].name}: port ${pp.join('|')} is used by ${used[k].length} links`, used[k]); }
  undefV.forEach(v => add('warn', `VLAN ${v} is used on links but not defined (Diagram → VLANs)`));
  const ips = {};
  const re = /\b(\d{1,3}(?:\.\d{1,3}){3})(?:\/\d{1,2})?\b/g;
  page.devices.forEach(d => d.fields.forEach(f => {
    let m; const s = String(f.value || '');
    while ((m = re.exec(s))) {
      const ip = m[1];
      if (ip.split('.').some(o => +o > 255)) add('warn', `${d.name}: “${ip}” is not a valid IPv4 address`, [d.id]);
      else (ips[ip] = ips[ip] || new Set()).add(d.id);
    }
  }));
  for (const ip in ips) if (ips[ip].size > 1) add('error', `Duplicate IP ${ip} on ${[...ips[ip]].map(i => I.dev[i].name).join(', ')}`, [...ips[ip]]);
  const linked = new Set(page.links.flatMap(l => [l.a.dev, l.b.dev]));
  page.devices.forEach(d => { if (!linked.has(d.id)) add('info', `${d.name} has no connections`, [d.id]); });
  const order = {error: 0, warn: 1, info: 2};
  return out.sort((a, b) => order[a.level] - order[b.level]);
}

const DEV_COLS = {name: ['name','device','hostname','devicename','node'], type: ['type','devicetype','kind','category'], tier: ['tier','layer','level'],

  ports: ['ports','portgroups','interfaces'], rows: ['rows','portrows'], view: ['view','style','display'], zone: ['zone','rack','site','location','group'], x: ['x'], y: ['y']};

  aport: ['aport','porta','sourceport','fromport','localport','port','interface','localinterface','localport'],
  bdev: ['bdevice','deviceb','target','to','targetdevice','bdev','remotedevice','neighbor','neighbour','remotehost','neighbordevice'],

function importDevicesCSV(doc, page, text) {
  const rows = parseCSV(text); if (rows.length < 2) throw new Error('Need a header row and at least one data row.');

function importLinksCSV(doc, page, text) {

/* infer tiers for devices that all share tier 0 (e.g. after an import) from device types and graph distance */
function inferTiers(page) {
  const rank = {internet: 0, cloud: 0, router: 1, firewall: 1, lb: 2, l3switch: 2, switch: 3, patch: 3, ap: 4, server: 4, vm: 4, storage: 4, pc: 5, phone: 5, camera: 5, other: 4};
  page.devices.forEach(d => { d.tier = rank[d.type] ?? 4; });
  /* switches: aggregation/core sits above access — connected to L3/WAN gear, or aggregating switches with fewer switch neighbors */
  const by = {}; page.devices.forEach(d => by[d.id] = d);
  const nb = {}; page.links.forEach(l => { if (by[l.a.dev] && by[l.b.dev]) { (nb[l.a.dev] = nb[l.a.dev] || []).push(by[l.b.dev]); (nb[l.b.dev] = nb[l.b.dev] || []).push(by[l.a.dev]); } });
  const isSw = d => ['switch', 'l3switch'].includes(d.type);
  const sd = d => (nb[d.id] || []).filter(isSw).length;
  page.devices.filter(isSw).forEach(d => {
    const n = nb[d.id] || [];
    if (n.some(o => ['router', 'firewall', 'cloud', 'internet', 'lb'].includes(o.type))) d.tier = 2.5;

function vConn(o) {
  const dx = o.x2 - o.x1, dy = o.y2 - o.y1, len = Math.max(Math.hypot(dx, dy), 0.001), ang = Math.atan2(dy, dx);
  const c = [];
  const gb = o.from ? '_WALKGLUE(BegTrigger,EndTrigger,WalkPreference)' : null, ge = o.to ? '_WALKGLUE(EndTrigger,BegTrigger,WalkPreference)' : null;
  c.push(vc('PinX', (o.x1 + o.x2) / 2, 'GUARD((BeginX+EndX)/2)'), vc('PinY', (o.y1 + o.y2) / 2, 'GUARD((BeginY+EndY)/2)'),
    vc('Width', len, 'GUARD(SQRT((EndX-BeginX)^2+(EndY-BeginY)^2))'), vc('Height', 0), vc('LocPinX', len / 2, 'GUARD(Width*0.5)'), vc('LocPinY', 0, 'GUARD(Height*0.5)'),
    vc('Angle', ang, 'GUARD(ATAN2(EndY-BeginY,EndX-BeginX))'), vc('FlipX', 0), vc('FlipY', 0),
    vc('BeginX', o.x1, gb), vc('BeginY', o.y1, gb), vc('EndX', o.x2, ge), vc('EndY', o.y2, ge));
  if (o.from) c.push(vc('BegTrigger', 2, `_XFTRIGGER(Sheet.${o.from}!EventXFMod)`));
  if (o.to) c.push(vc('EndTrigger', 2, `_XFTRIGGER(Sheet.${o.to}!EventXFMod)`));
  c.push(vc('ObjType', 2), vc('LineColor', vCol(o.color)), vc('LineWeight', (o.lw || 1.5) * 0.75 / 72, null, 'PT'), vc('LinePattern', o.pat || 1),
    vc('BeginArrow', 0), vc('EndArrow', 0), vc('FillPattern', 0), vc('ShapeRouteStyle', 0), vc('ConFixedCode', 0));
  let sec = '', text = '';
  if (o.label) {
    const tw2 = tw(o.label, 8) / VPX + 0.12;
    c.push(vc('TxtWidth', tw2), vc('TxtHeight', 0.16), vc('TxtPinX', len / 2, 'Width*0.5'), vc('TxtPinY', o.drop || 0, o.drop ? null : 'Height*0.5'),
      vc('TxtLocPinX', tw2 / 2, 'TxtWidth*0.5'), vc('TxtLocPinY', 0.08, 'TxtHeight*0.5'), vc('TxtAngle', -ang, '-Angle'), vc('TextBkgnd', '#FFFFFF'), vc('VerticalAlign', 1));
    sec += `<Section N="Character">${vCharRow(0, o.color, 8, 0)}</Section><Section N="Paragraph">${vParaRow(1)}</Section>`;
    text = `<Text>${xe(o.label)}</Text>`;
  }
  if (o.props) sec += `<Section N="Property">${o.props.map(([l, v], i) => `<Row N="Row_${i + 1}">${vc('Value', String(v ?? ''), null, 'STR')}${vc('Label', l)}${vc('Type', 0)}</Row>`).join('')}</Section>`;
  const dr = o.drop || 0;   /* same-side links loop out below/above their devices */
  sec += `<Section N="Geometry" IX="0">${vc('NoFill', 1)}${vc('NoLine', 0)}${vc('NoShow', 0)}${vc('NoSnap', 0)}<Row T="MoveTo" IX="1">${vc('X', 0, 'Width*0')}${vc('Y', 0, 'Height*0')}</Row>` +
    (dr ? `<Row T="LineTo" IX="2">${vc('X', 0, 'Width*0')}${vc('Y', dr)}</Row><Row T="LineTo" IX="3">${vc('X', len, 'Width*1')}${vc('Y', dr)}</Row><Row T="LineTo" IX="4">${vc('X', len, 'Width*1')}${vc('Y', 0, 'Height*0')}</Row>`
        : `<Row T="LineTo" IX="2">${vc('X', len, 'Width*1')}${vc('Y', 0, 'Height*0')}</Row>`) + `</Section>`;
  return `<Shape ID="${o.id}" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">${c.join('')}${sec}${text}</Shape>`;
}

function vsdxPage(doc, pg) {
  const R = render(doc, pg, {title: false}), {pos, M, I} = R, S = doc.settings;
  const C = R.content;
  /* layout of extras (title above, legend + table below) in diagram px */
  const titleH = (doc.title ? 26 : 0) + (doc.subtitle ? 18 : 0);
  let x0 = C.x - 30, y0 = C.y - 30 - titleH, x1 = C.x + C.w + 30;
  const links = R.links;
  const usedLt = doc.linkTypes.filter(t => links.some(l => l.type === t.id));
  const hv = doc.vlans.filter(v => v.highlight && links.some(l => linkVlans(l).includes(v.id)));
  const legendItems = S.legend ? [...usedLt.map(t => ({c: t.color, w: t.width, pat: vDash(t.dash), t: t.name})), ...hv.map(v => ({c: v.color, w: 2, pat: 1, t: 'VLAN ' + v.id + (v.name ? ' · ' + v.name : '')}))] : [];
  const tm = S.table ? tableModel(doc, pg, links, M, I) : null;
  let yLeg = C.y + C.h + 30, yTab = yLeg + (legendItems.length ? Math.ceil(legendItems.length / 4) * 20 + 24 : 0);
  let tabW = tm ? tm.cols.reduce((s, c) => s + c.w, 0) + 24 : 0;
  x1 = Math.max(x1, C.x + Math.max(tabW, 520) + 30);
  let y1 = (tm ? yTab + 40 + tm.rowsD.length * 17 + 8 : yLeg + (legendItems.length ? Math.ceil(legendItems.length / 4) * 20 + 24 : 0)) + 30;
  const PW = (x1 - x0) / VPX, PH = (y1 - y0) / VPX;
  const X = x => (x - x0) / VPX, Y = y => (y1 - y) / VPX;
  const box = (x, y, w, h) => ({px: X(x + w / 2), py: Y(y + h / 2), w: w / VPX, h: h / VPX});
  let nid = 1; const id = () => nid++;
  const shapes = [], connects = [], devSheet = {}, portSheet = {};

  /* zones (back) */
  if (!doc.view.hideZones) pg.zones.forEach(z => {
    const b = R.ZB[z.id]; if (!b) return;
    shapes.push(vShape({id: id(), ...box(b.x, b.y, b.w, b.h), fill: vTint(z.color, .94), line: z.color, lw: 1, pat: 2, round: 8, va: 0, ha: 0, margin: 6,
      runs: [{t: z.name, color: z.color, fs: 9, bold: 1}]}));
  });
  /* notes */
  if (!doc.view.hideNotes) pg.notes.forEach(n => {
    const b = R.NB[n.id]; if (!b) return;
    shapes.push(vShape({id: id(), ...box(b.x, b.y, b.w, b.h), fill: vTint(n.color, .85), line: n.color, lw: 1, round: 4, va: 0, ha: 0, margin: 6, runs: [{t: n.text, fs: 10.5}]}));
  });
  /* devices */
  pg.devices.forEach(d => {
    const p = pos[d.id], m = M[d.id], col = devColor(d);
    const props = [['Name', d.name], ['Type', (TYPES[d.type] || TYPES.other).label], ['Role', d.sub], ['Model', d.model],
      ...d.fields.filter(f => f.label).map(f => [f.label, f.secret && S.mask ? '••••••' : f.value])];
    if (m.kind === 'panel') {
      const gid = id(); devSheet[d.id] = gid;
      const kids = [];
      const lx = x => x / VPX, ly = y => (p.h - y) / VPX;   // child coords relative to group bottom-left
      m.glabels.forEach(g => kids.push(vShape({id: id(), px: lx(g.x), py: ly(39), w: Math.max(tw(g.l1, 8), tw(g.l2, 8), 40) / VPX, h: 24 / VPX, fill: null, line: null, margin: 0,
        runs: [{t: g.l1, color: g.color, fs: 8, bold: 1}, g.l2 ? {t: g.l2, color: g.vcolor, fs: 8} : null]})));
      for (const pn in m.ports) {
        const q = m.ports[pn], sid = id(); portSheet[d.id + '|' + pn] = sid;
        const used = links.find(l => (l.a.dev === d.id && l.a.port === pn) || (l.b.dev === d.id && l.b.port === pn));
        const pc = used ? linkColor(used, I) : (q.g.color || col);
        kids.push(vShape({id: sid, px: lx(q.x + q.w / 2), py: ly(q.y + q.h / 2), w: q.w / VPX, h: q.h / VPX, fill: used ? vTint(pc, .8) : '#F4F6FB', line: pc, lw: used ? 1.5 : .8, round: 3, margin: 1,
          runs: [{t: shortPort(pn), color: pc, fs: 8, bold: 1}], props: [['Port', pn], ['Group', q.g.label], ['Speed', q.g.speed], ['Access VLAN', q.g.vlan]]}));
      }
      /* the body is the first (back-most) member, so the ports draw on top of it; the group itself has no fill */
      kids.unshift(vShape({id: id(), px: p.w / 2 / VPX, py: p.h / 2 / VPX, w: p.w / VPX, h: p.h / VPX, fill: '#FFFFFF', line: col, lw: 2, round: 6, va: 0, margin: 4,
        runs: [{t: d.name + ([d.model, d.sub].filter(Boolean).length ? '   ' + [d.model, d.sub].filter(Boolean).join(' · ') : ''), color: col, fs: 12, bold: 1}]}));
      shapes.push(vShape({id: gid, ...box(p.x, p.y, p.w, p.h), fill: null, line: null, props, children: kids}));
    } else if (m.kind === 'icon') {
      const gid = id(); devSheet[d.id] = gid;
      const tx = p.x + (p.w - 44) / 2;
      const inner = vShape({id: id(), px: 22 / VPX, py: 22 / VPX, w: 44 / VPX, h: 44 / VPX, fill: vTint(col, .85), line: col, lw: 1.6, round: 10, runs: [{t: ABBR[d.type] || 'DEV', color: col, fs: 11, bold: 1}]});
      const lw = (Math.max(tw(d.name, 10), tw(d.sub, 8)) + 12) / VPX;
      shapes.push(vShape({id: gid, px: X(tx + 22), py: Y(p.y + 22), w: 44 / VPX, h: 44 / VPX, fill: null, line: null, va: 0,
        txt: {x: 22 / VPX, y: -(d.sub ? 16 : 10) / VPX, w: lw, h: (d.sub ? 30 : 16) / VPX},
        runs: [{t: d.name, fs: 10, bold: 1}, d.sub ? {t: d.sub, color: '#5A6080', fs: 8} : null], props, children: [inner]}));
    } else {
      const sid = id(); devSheet[d.id] = sid;
      shapes.push(vShape({id: sid, ...box(p.x, p.y, p.w, p.h), fill: vTint(col, .9), line: col, lw: 1.5, round: d.type === 'cloud' ? 14 : 5, va: 0, margin: 5,
        runs: [{t: d.name, color: col, fs: 10, bold: 1}, {t: m.sub, color: '#5A6080', fs: 8}, ...m.lines.map(l => ({t: (l.label ? l.label + ': ' : '') + l.value, fs: 8.5}))], props}));
    }
  });
  /* links */
  links.forEach(l => {
    const g = R.LG[l.id]; if (!g) return;
    const t = I.lt[l.type] || {}, col = linkColor(l, I);
    const from = portSheet[l.a.dev + '|' + l.a.port] || devSheet[l.a.dev], to = portSheet[l.b.dev + '|' + l.b.port] || devSheet[l.b.dev];
    const cid = id();
    let drop = 0;
    if (g.as === g.bs) {
      const ang = Math.atan2(Y(g.by) - Y(g.ay), X(g.bx) - X(g.ax));
      drop = (g.as > 0 ? -1 : 1) * Math.cos(ang) * (28 + Math.abs(g.ay - g.by) * 0.5) / VPX;
    }
    shapes.push(vConn({id: cid, drop, x1: X(g.ax), y1: Y(g.ay), x2: X(g.bx), y2: Y(g.by), color: col, lw: t.width || 1.5, pat: vDash(t.dash), label: linkLabel(l, S), from, to,
      props: [['A', I.dev[l.a.dev].name + (l.a.port ? ':' + l.a.port : '')], ['B', I.dev[l.b.dev].name + (l.b.port ? ':' + l.b.port : '')], ['Type', t.name || ''], ['Speed', l.speed], ['VLANs', compressPorts(linkVlans(l))], ['LAG', l.lag]]}));
    if (from) connects.push(`<Connect FromSheet="${cid}" FromCell="BeginX" FromPart="9" ToSheet="${from}" ToCell="PinX" ToPart="3"/>`);
    if (to) connects.push(`<Connect FromSheet="${cid}" FromCell="EndX" FromPart="12" ToSheet="${to}" ToCell="PinX" ToPart="3"/>`);
  });
  /* title */
  if (doc.title || doc.subtitle) {
    const tw3 = Math.max(tw(doc.title, 15), tw(doc.subtitle, 11)) + 20;
    shapes.push(vShape({id: id(), ...box(C.x, C.y - 20 - titleH, tw3, titleH + 4), fill: null, line: null, ha: 0, margin: 0,
      runs: [{t: (doc.title || '').toUpperCase() + (doc.pages.length > 1 ? '  —  ' + pg.name.toUpperCase() : ''), color: '#5A6080', fs: 15, bold: 1}, {t: doc.subtitle, color: '#5A6080', fs: 11}]}));
  }
  /* legend */
  legendItems.forEach((it, i) => {
    const lx = C.x + 14 + (i % 4) * 190, ly = yLeg + 14 + Math.floor(i / 4) * 20;
    shapes.push(vConn({id: id(), x1: X(lx), y1: Y(ly), x2: X(lx + 30), y2: Y(ly), color: it.c, lw: Math.max(2, it.w), pat: it.pat}));
    shapes.push(vShape({id: id(), ...box(lx + 36, ly - 8, 150, 16), fill: null, line: null, ha: 0, margin: 0, runs: [{t: it.t, color: '#5A6080', fs: 9}]}));
  });
  /* port map table */
  if (tm) {
    const {rowsD, cols, data} = tm;
    const W = Math.max(tabW, 520), tx0 = C.x;
    if (tabW < W) { const extra = (W - tabW) / cols.length; cols.forEach(c => c.w += extra); }
    shapes.push(vShape({id: id(), ...box(tx0, yTab, W, 40 + rowsD.length * 17 + 8), fill: '#FFFFFF', line: '#C8CFE0', lw: 1, round: 5, va: 0, margin: 4,
      runs: [{t: 'PORT MAP REFERENCE', color: '#0277BD', fs: 9, bold: 1}]}));
    let cx = tx0 + 12;
    cols.forEach((c, ci) => {
      shapes.push(vShape({id: id(), ...box(cx, yTab + 20, c.w, 14), fill: null, line: null, ha: 0, margin: 2, runs: [{t: c.h, color: '#5A6080', fs: 8, bold: 1}]}));
      rowsD.forEach((d, ri) => {
        const v = data[ri][ci];
        shapes.push(vShape({id: id(), ...box(cx, yTab + 37 + ri * 17, c.w, 15), fill: ri % 2 ? null : '#F1F3F9', line: null, ha: 0, margin: 2,
          runs: [{t: v, color: c.c ? c.c(d) : '#1A2040', fs: 8.5, bold: c.fw === 600 ? 1 : 0}]}));
      });
      cx += c.w;
    });
  }
  const xml = `<?xml version="1.0" encoding="utf-8" standalone="yes"?>\n<PageContents xmlns="${VNS}" xmlns:r="${RNS}" xml:space="preserve"><Shapes>${shapes.join('')}</Shapes>${connects.length ? `<Connects>${connects.join('')}</Connects>` : ''}</PageContents>`;
  return {xml, PW, PH};
}

function drawMini() {

function guessTier(y) {
  const P = pg(); if (!P.devices.length) return 0;
  let best = null;
  P.devices.forEach(d => { const dd = Math.abs((+d.y || 0) - y); if (!best || dd < best.dd) best = {dd, t: +d.tier || 0}; });
  if (best.dd < 80) return best.t;
  const above = P.devices.filter(d => d.y < y).map(d => +d.tier || 0), below = P.devices.filter(d => d.y > y).map(d => +d.tier || 0);
  if (above.length && !below.length) return Math.max(...above) + 1;
  if (below.length && !above.length) return Math.min(...below) - 1;
  return best.t;
}

let findState = {q: '', i: -1};
function findNext(back) {
  const q = $('#find').value.trim().toLowerCase();
  if (!q) return;
  const hits = [];
  doc.pages.forEach((p, pi) => {
    p.devices.forEach(d => {
      const hay = [d.name, d.sub, d.model, ...d.fields.map(f => f.value), ...portsOf(d)].join('\n').toLowerCase();
      if (hay.includes(q)) hits.push({pi, id: d.id});
    });
    p.links.forEach(l => { if ([l.label, l.lag, l.vlans].join(' ').toLowerCase().includes(q)) hits.push({pi, id: l.id}); });
    p.notes.forEach(n => { if (n.text.toLowerCase().includes(q)) hits.push({pi, id: n.id}); });
  });
  if (!hits.length) { toast('No matches for “' + q + '”'); return; }
  if (findState.q !== q) findState = {q, i: -1};
  findState.i = (findState.i + (back ? -1 : 1) + hits.length) % hits.length;
  const h = hits[findState.i];
  if (h.pi !== doc.active) switchPage(h.pi);
  sel = new Set([h.id]); rtab = 'format'; draw(); refresh(); centerOn();
  stat(`Match ${findState.i + 1} of ${hits.length} — Enter for next, Shift+Enter for previous`);
}

function openFile(file) {

    if (/\.(vssx|vstx)$/i.test(file.name)) { toast('That is a Visio stencil/template — open a Visio drawing (.vsdx) instead'); return; }

function initKeys() {

    const tg = document.activeElement, typing = tg && /INPUT|SELECT|TEXTAREA/.test(tg.tagName);
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (e.key === 'Escape') {
      if (!$('#modal').hidden) { closeModal(); return; }
      if (!$('#menu').hidden) { hideMenu(); return; }
      if (drag) { drag = null; ovl(''); restoreSnap(lastSnap); return; }
      if (typing) { tg.blur(); return; }
      if (sel.size) { sel = new Set(); draw(); refresh(); }
      return;
    }
    if (mod && k === 's') { e.preventDefault(); saveJSON(); return; }
    if (mod && k === 'o') { e.preventDefault(); $('#file').click(); return; }
    if (mod && k === 'p') { e.preventDefault(); printDoc(); return; }
    if (mod && k === 'f') { e.preventDefault(); $('#find').focus(); $('#find').select(); return; }
    if (typing || !$('#modal').hidden) return;
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 'c') { e.preventDefault(); copySel(); }
    else if (mod && k === 'x') { e.preventDefault(); copySel(true); }
    else if (mod && k === 'v') { e.preventDefault(); pasteClip(clip); }
    else if (mod && k === 'd') { e.preventDefault(); duplicateSel(); }
    else if (mod && k === 'a') { e.preventDefault(); selectAll(); }
    else if (mod && k === 'g') { e.preventDefault(); zoneFromSel(); }
    else if (mod && e.shiftKey && k === 'h') { e.preventDefault(); fitView(); applyView(); }
    else if (mod && e.shiftKey && k === 'l') { e.preventDefault(); autoLayoutPage(); }
    else if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomAt(0.8); }
    else if (mod && k === '-') { e.preventDefault(); zoomAt(1.25); }
    else if (mod && k === '0') { e.preventDefault(); zoomTo100(); }
    else if (mod) return;
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); }
    else if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      const s = e.shiftKey ? 10 : 1;
      nudge(e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0);
    }
    else if (k === 'v') setTool('select');
    else if (k === 'l') setTool('link');
    else if (k === 'h') setTool('hand');
    else if (k === 'n') { addNote({x: view.x + view.w / 2, y: view.y + view.h / 2}); }
    else if (e.key === '?') helpModal();
    else if (e.key === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; stage().classList.add('panning'); } }
  });

  document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu') && !e.target.closest('.mbtn')) hideMenu(); });
}

   ════════════════════════════════════════════════════════════════════ */
function isRackPage() { return !!(pg() && pg().kind === 'rack'); }
function rackById(id) { return isRackPage() ? pg().racks.find(r => r.id === id) || null : null; }
function rackItemById(id) { if (!isRackPage()) return null; for (const r of pg().racks) { const it = r.items.find(i => i.id === id); if (it) return {r, it}; } return null; }
function rackIds() { const s = new Set(); if (isRackPage()) pg().racks.forEach(r => { s.add(r.id); r.items.forEach(i => s.add(i.id)); }); return s; }
var rackVendorTab = 'hpe';

/* where on which rack is this canvas point? → {r, side, u} */
function rackHit(p) {
  if (!R || !R.racks) return null;
  for (const L of R.racks) for (const side of ['front', 'rear']) {
    const X = side === 'front' ? L.front : L.rear, x0 = X + RK.cl + RK.rail, y0 = RK.top;
    if (p.x >= X && p.x <= X + RK.W && p.y >= 0 && p.y <= L.H) {
      const u = Math.max(1, Math.min(L.R, L.R - Math.floor((p.y - y0) / RK.U)));
      return {r: L.r, side, u, inRails: p.x >= x0 && p.x <= x0 + RK.W19, L};
    }
  }
  return null;
}
function rackPlace(model, p) {
  const P = pg(); if (!P.racks.length) { toast('Add a rack first'); return; }
  const h = p && rackHit(p), g = RACK_GEAR[model];
  let r = h ? h.r : (rackById([...sel][0]) || (rackItemById([...sel][0]) || {}).r || P.racks[0]);
  let u = h ? Math.max(1, h.u - g.u + 1) : 0;
  if (h && g.cat !== 'pdu0u' && !rackFits(r, model, u)) { const alt = rackFreeU(r, model, h.u); u = alt; }
  const it = rackAdd(r, model, '', u || undefined);
  if (!it) { toast(g.cat === 'pdu0u' ? `${r.name} already has PDU A and PDU B` : `No free ${g.u}U space in ${r.name}`); return; }
  const kv = (g.cat === 'kvm' || g.cat === 'kvmcon') && r.cables.length;
  if (kv) rackAutoWire(r, P);
  sel = new Set([it.id]); rtab = 'format'; commit(); refresh();
  toast(`Added ${gearOf(it).name}${g.cat === 'pdu0u' ? ' as PDU ' + it.side : ' at U' + it.u}` + (kv ? ' and re-wired the rack' : ' — use Auto-wire to cable it'));
}
function addRack(model) {
  const P = pg(), spec = RACK_MODELS[model];
  let n = P.racks.length + 1; while (P.racks.some(x => x.name === `Rack A${String(n).padStart(2, '0')}`)) n++;
  const r = newRack(`Rack A${String(n).padStart(2, '0')}`, model);
  P.racks.push(r); normRackPage(P);
  const pdu = spec.vendor === 'hpe' ? 'hpe-g2-pdu' : 'dell-pdu'; rackAdd(r, pdu); rackAdd(r, pdu);      /* every rack comes with PDU A / B */ sel = new Set([r.id]); rtab = 'format'; view = null; commit(); refresh();
  toast(`Added ${spec.name}`);
}

/* ── canvas hooks (called from initCanvas) ── */
function rackPointerDown(e, p) {
  const t = e.target, itg = t.closest('[data-ritem]'), rk = t.closest('[data-rack]'), cb = t.closest('[data-rcable]');
  if (itg) {
    const id = itg.getAttribute('data-ritem'), f = rackItemById(id); if (!f) return true;
    sel = new Set([id]);
    drag = {kind: 'rackmove', id, sx: p.x, sy: p.y, orig: {r: f.r, u: f.it.u, side: f.it.side}, moved: false};
    draw(); return true;
  }
  if (cb) { const [rid, cid] = cb.getAttribute('data-rcable').split('|'); sel = new Set([rid]); rtab = 'format'; draw(); refresh(); const c = (rackById(rid) || {cables: []}).cables.find(x => x.id === cid); if (c) toast(cableText(rackById(rid), c)); return true; }
  if (rk) { sel = new Set([rk.getAttribute('data-rack')]); rtab = 'format'; draw(); refresh(); return true; }
  if (sel.size) { sel = new Set(); draw(); refresh(); }
  return true;
}
function rackPointerMove(e, p) {
  if (!drag || drag.kind !== 'rackmove') return false;
  const z = zoom(); if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) * z < 3) return true;
  drag.moved = true;
  const f = rackItemById(drag.id); if (!f) return true;
  const g = gearOf(f.it), h = rackHit(p);
  if (!h) { ovl(''); drag.target = null; return true; }
  if (g.cat === 'pdu0u') {
    const side = (p.x - (h.side === 'front' ? h.L.front : h.L.rear)) < RK.W - RK.cr / 2 ? 'A' : 'B';
    drag.target = {r: h.r, side};
    const L = h.L, pw = (RK.cr - 9) / 2, x = L.rear + RK.W - RK.cr + 3 + (side === 'B' ? pw + 3 : 0);
    ovl(`<rect x="${x}" y="${RK.top + 6}" width="${pw}" height="${L.R * RK.U - 12}" fill="var(--accent)" fill-opacity=".2" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>`);
    return true;
  }
  const grab = drag.grab ?? (drag.grab = Math.max(0, Math.min(g.u - 1, (f.it.u + g.u - 1) - (rackHit({x: drag.sx, y: drag.sy}) || {u: f.it.u}).u)));
  const u = Math.max(1, Math.min(h.L.R - g.u + 1, h.u - (g.u - 1 - grab)));
  const ok = rackFits(h.r, f.it.model, u, f.it.id);
  drag.target = ok ? {r: h.r, u} : null;
  const ys = RK.top + (h.L.R - (u + g.u - 1)) * RK.U, col = ok ? 'var(--ok)' : 'var(--danger)';
  ovl(['front', 'rear'].map(sd => `<rect x="${(sd === 'front' ? h.L.front : h.L.rear) + RK.cl + RK.rail}" y="${ys}" width="${RK.W19}" height="${g.u * RK.U}" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('') +
    `<text x="${h.L.front + RK.cl + RK.rail + 4}" y="${ys - 4}" font-size="11" font-family="${SANS}" fill="${col}">U${u}${ok ? '' : ' — occupied'}</text>`);
  return true;
}
function rackPointerEnd(d) {
  if (!d || d.kind !== 'rackmove') return false;
  ovl('');
  if (!d.moved) { rtab = 'format'; draw(); refresh(); return true; }
  const f = rackItemById(d.id);
  if (f && d.target) {
    const g = gearOf(f.it);
    if (g.cat === 'pdu0u') {
      const clash = d.target.r.items.find(i => i !== f.it && gearOf(i).cat === 'pdu0u' && i.side === d.target.side);
      if (clash) clash.side = f.it.side;
      f.it.side = d.target.side;
    } else { f.it.u = d.target.u; rackClearBlanks(d.target.r, f.it); }
    if (d.target.r !== f.r) {                        /* moved into another rack: its cables stay behind */
      f.r.items.splice(f.r.items.indexOf(f.it), 1); f.r.cables = f.r.cables.filter(c => c.a.i !== f.it.id && c.b.i !== f.it.id);
      d.target.r.items.push(f.it); toast(`Moved to ${d.target.r.name} — run Auto-wire to cable it there`);
    }
    commit(); refresh();
  } else { draw(); if (d.moved) toast('That space is taken — item left where it was'); }
  return true;
}
function rackDeleteSel() {
  const P = pg(); let n = 0;
  P.racks = P.racks.filter(r => { if (sel.has(r.id)) { n++; return false; } return true; });
  P.racks.forEach(r => {
    const gone = new Set(r.items.filter(i => sel.has(i.id)).map(i => i.id)); n += gone.size;
    r.items = r.items.filter(i => !gone.has(i.id)); r.cables = r.cables.filter(c => !gone.has(c.a.i) && !gone.has(c.b.i));
  });
  sel = new Set(); if (n) { commit(); refresh(); toast(`Deleted ${n} item(s)`); }
}
function rackContextItems(id) {
  const f = id && rackItemById(id), r = id && (rackById(id) || (f && f.r));
  if (!r) return [{label: 'Add HPE rack', fn: () => addRack('hpe-g2-42-600')}, {label: 'Add Dell rack', fn: () => addRack('dell-4220')}, '-', {label: 'Fit page', fn: () => { fitView(); applyView(); }}];
  const it = [{label: `Auto-wire ${r.name}`, fn: () => runAutoWire(r)}, {label: 'Clear cables', dis: !r.cables.length, fn: () => { r.cables = []; commit(); refresh(); }}];
  if (f) it.unshift({label: 'Duplicate below', dis: gearOf(f.it).cat === 'pdu0u', fn: () => { const g = gearOf(f.it); const u = rackFreeU(r, f.it.model, f.it.u - 1); if (!u) return toast('No free space below'); const n = rackAdd(r, f.it.model, '', u); sel = new Set([n.id]); commit(); refresh(); }}, '-');
  return [...it, '-', {label: 'Delete', k: 'Del', danger: true, fn: rackDeleteSel}];
}
function runAutoWire(r) {
  const res = rackAutoWire(r, pg()); commit(); refresh();
  toast(`${r.name}: ${res.cables} cables` + (res.miss.length ? ' · ' + res.miss.join(' · ') : ''));
}

/* ── left panel ── */
function rackPalette(P) {
  const tabs = el('div', {class: 'chips', style: 'margin:2px 0 6px'},
    ...[['hpe', 'HPE'], ['dell', 'Dell']].map(([k, l]) => el('button', {class: 'mini' + (rackVendorTab === k ? ' on' : ''), onclick: () => { rackVendorTab = k; renderPalette(); }}, l)));
  P.append(tabs);
  const item = (label, sub, onadd, drag) => el('div', {class: 'shape', style: 'grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:8px;padding:6px 8px;text-align:left', draggable: drag ? 'true' : 'false', role: 'button', tabindex: '0',
    title: drag ? 'Drag into a rack slot, or click to add at the next free U' : 'Click to add',
    ondragstart: drag ? (e => { e.dataTransfer.setData('text/nd-rack', drag); e.dataTransfer.effectAllowed = 'copy'; }) : null,
    onclick: onadd, onkeydown: e => { if (e.key === 'Enter') onadd(); }},
    el('span', {style: 'display:flex;flex-direction:column;line-height:1.25'}, el('span', {}, label), el('span', {class: 'hint', style: 'margin:0;font-size:10.5px'}, sub)));
  P.append(el('div', {class: 'cat'}, 'Racks'));
  Object.entries(RACK_MODELS).filter(([, m]) => m.vendor === rackVendorTab).forEach(([k, m]) => {
    if (shapeQ && !m.name.toLowerCase().includes(shapeQ)) return;
    P.append(item(m.name.replace(/^(HPE|Dell) /, ''), m.u + 'U cabinet', () => addRack(k)));
  });
  RACK_CATS.forEach(([cat, label]) => {
    const list = Object.entries(RACK_GEAR).filter(([, g]) => g.cat === cat && (g.vendor === rackVendorTab || g.vendor === 'any') && (!shapeQ || g.name.toLowerCase().includes(shapeQ)));
    if (!list.length) return;
    P.append(el('div', {class: 'cat'}, label));
    list.forEach(([k, g]) => P.append(item(g.name.replace(/^(HPE Aruba Networking|HPE ProLiant|Dell PowerEdge|Dell PowerSwitch|HPE|Dell) /, ''),
      g.cat === 'pdu0u' ? '0U · rear side' : `${g.u}U${g.down ? ` · ${g.down}× ${g.dspeed || 'RJ45'}` : ''}${g.mgmt && g.cat === 'server' ? ' · ' + g.mgmt : ''}`, () => rackPlace(k), k)));
  });
}
function rackNav(N) {
  const P = pg(), rows = [];
  P.racks.forEach(r => {
    rows.push(el('div', {class: 'navi' + (sel.has(r.id) ? ' on' : ''), onclick: () => { sel = new Set([r.id]); rtab = 'format'; draw(); refresh(); }}, el('span', {class: 'dot', style: `background:${rackSpec(r).vendor === 'hpe' ? '#01a982' : '#007db8'}`}), el('span', {class: 'nm'}, r.name), el('span', {class: 'meta'}, rackSpec(r).u + 'U')));
    r.items.filter(i => i.name && !navQ || (navQ && (i.name + ' ' + gearOf(i).name).toLowerCase().includes(navQ))).sort((a, b) => b.u - a.u).forEach(it => {
      const g = gearOf(it); if (!it.name && (g.cat === 'blank' || g.cat === 'cable')) return;
      rows.push(el('div', {class: 'navi' + (sel.has(it.id) ? ' on' : ''), style: 'padding-left:18px', onclick: () => { sel = new Set([it.id]); rtab = 'format'; draw(); refresh(); }},
        el('span', {class: 'nm'}, it.name || g.name), el('span', {class: 'meta'}, g.cat === 'pdu0u' ? 'PDU ' + it.side : 'U' + it.u)));
    });
  });
  if (!rows.length) N.append(el('div', {class: 'hint'}, 'No racks on this page yet')); else N.append(...rows);
}

/* ── right panel ── */
function sideRack() {
  const f = document.createDocumentFragment(), P = pg(), id = [...sel][0];
  const fi = id && rackItemById(id), r = id && (rackById(id) || (fi && fi.r));
  const card = (title, ...kids) => el('div', {class: 'card'}, el('h3', {}, title), ...kids);

    const it = fi.it, g = gearOf(it);
    const same = Object.entries(RACK_GEAR).filter(([, x]) => x.cat === g.cat);
    const uIn = el('input', {type: 'number', min: 1, max: rackSpec(fi.r).u, value: it.u, 'aria-label': 'U position'});
    uIn.onchange = () => { const u = Math.round(+uIn.value); if (rackFits(fi.r, it.model, u, it.id)) { it.u = u; rackClearBlanks(fi.r, it); commit(); refresh(); } else { toast(`U${u} doesn’t fit — space taken or past the top`); uIn.value = it.u; } };

    mSel.onchange = () => { if (g.cat === 'pdu0u' || rackFits(fi.r, mSel.value, it.u, it.id)) { it.model = mSel.value; rackClearBlanks(fi.r, it); fi.r.cables = fi.r.cables.filter(c => c.a.i !== it.id && c.b.i !== it.id); commit(); refresh(); toast('Model changed — run Auto-wire to re-cable'); } else { toast('That model is taller and doesn’t fit here'); mSel.value = it.model; } };
    const cs = fi.r.cables.filter(c => c.a.i === it.id || c.b.i === it.id);
    f.append(card(g.cat === 'server' ? 'Server' : g.cat === 'pdu0u' ? 'PDU' : g.cat === 'tor' || g.cat === 'mgmt' ? 'Switch' : 'Rack item',
      row('Name', bind(it, 'name', {focus: true, ph: 'hostname'})), row('Model', mSel),
      g.cat === 'pdu0u' ? row('Side', bsel(it, 'side', [['A', 'A (left)'], ['B', 'B (right)']])) : row('Bottom U', uIn),
      el('div', {class: 'hint'}, `${g.name} · ${g.cat === 'pdu0u' ? '0U' : g.u + 'U, occupies U' + it.u + (g.u > 1 ? '–' + (it.u + g.u - 1) : '')} · in ${fi.r.name}`),
      el('div', {class: 'btns', style: 'margin-top:8px'}, el('button', {class: 'mini danger', onclick: rackDeleteSel}, 'Remove from rack'))));
    if (cs.length) f.append(card(`Cables · ${cs.length}`, el('div', {class: 'hint', style: 'margin:0'}, ...cs.map(c => el('div', {style: 'display:flex;gap:6px;align-items:center;margin:2px 0'}, el('span', {style: `width:14px;height:3px;background:${CABLE_COLORS[c.kind]};flex:none`}), cableText(fi.r, c))))));
    return f;
  }
  if (r) {
    const mSel = el('select', {'aria-label': 'Rack model'}, Object.entries(RACK_MODELS).map(([k, m]) => el('option', {value: k}, m.name))); mSel.value = r.model;
    mSel.onchange = () => { const nu = RACK_MODELS[mSel.value].u, over = r.items.filter(i => gearOf(i).cat !== 'pdu0u' && i.u + gearOf(i).u - 1 > nu); if (over.length) { toast(`${over.length} item(s) sit above U${nu} — move them down first`); mSel.value = r.model; return; } r.model = mSel.value; commit(); refresh(); };
    const i = P.racks.indexOf(r);
    f.append(card('Rack', row('Name', bind(r, 'name', {focus: true})), row('Model', mSel),
      el('div', {class: 'btns', style: 'margin-top:6px'},
        el('button', {class: 'mini', disabled: i === 0, onclick: () => { P.racks.splice(i - 1, 0, P.racks.splice(i, 1)[0]); commit(); refresh(); }}, '← Move left'),
        el('button', {class: 'mini', disabled: i === P.racks.length - 1, onclick: () => { P.racks.splice(i + 1, 0, P.racks.splice(i, 1)[0]); commit(); refresh(); }}, 'Move right →'),
        el('button', {class: 'mini danger', onclick: rackDeleteSel}, 'Delete rack'))));
    const W = r.wire;
    f.append(card('Auto-wiring',
      el('p', {class: 'hint'}, 'Cables every server’s NICs to the top-of-rack switches (alternating A / B for redundancy), iLO / iDRAC and switch MGMT ports to the management switch, switch uplinks to the patch panel, each server’s video / USB to the KVM switch (and the KVM switch to the monitor drawer), and PSU 1 / PSU 2 to PDU A / PDU B. Cables show on the rear view.'),
      el('div', {class: 'btns', style: 'margin:0 0 6px'}, el('span', {class: 'hint', style: 'margin:0;align-self:center'}, 'Add-ons:'),
        el('button', {class: 'mini', onclick: () => rackPlace(rackSpec(r).vendor === 'hpe' ? 'hpe-lcd8500' : 'dell-dkmmled185')}, '+ KVM monitor'),
        el('button', {class: 'mini', onclick: () => rackPlace(rackSpec(r).vendor === 'hpe' ? 'hpe-g3-kvm16' : 'dell-dav2216')}, '+ KVM switch')),
      row('NIC ports per server', bsel(W, 'dataPorts', [['1', '1'], ['2', '2 (OCP)'], ['4', '4 (OCP + PCIe)']].map(([v, l]) => [v, l]), {})),
      el('div', {class: 'chips', style: 'margin:6px 0'}, ...[['mgmt', 'iLO / iDRAC'], ['uplinks', 'Uplinks'], ['kvm', 'KVM'], ['power', 'Power']].map(([k, l]) => el('label', {class: 'chip' + (W[k] ? ' on' : '')}, bind(W, k, {type: 'checkbox'}), l))),
      el('div', {class: 'btns'}, el('button', {class: 'primary', onclick: () => runAutoWire(r)}, r.cables.length ? 'Re-wire rack' : 'Auto-wire rack'),
        el('button', {class: 'mini', disabled: !r.cables.length, onclick: () => { r.cables = []; commit(); refresh(); }}, 'Clear cables'))));
    const counts = {}; r.cables.forEach(c => counts[c.kind] = (counts[c.kind] || 0) + 1);
    if (r.cables.length) f.append(card(`Cables · ${r.cables.length}`, ...Object.keys(counts).map(k => el('div', {style: 'display:flex;gap:8px;align-items:center;font-size:12.5px;margin:3px 0'}, el('span', {style: `width:18px;height:3px;background:${CABLE_COLORS[k]}`}), el('span', {class: 'grow'}, CABLE_LABELS[k]), el('b', {}, String(counts[k])))),
      el('div', {class: 'btns', style: 'margin-top:6px'}, el('button', {class: 'mini', onclick: exportCableSchedule}, 'Cable schedule (CSV)'))));
    return f;
  }
  f.append(card('Rack page', row('Page name', bind(P, 'name', {reside: true})),
    el('div', {class: 'hint'}, `${P.racks.length} rack(s) · ${P.racks.reduce((a, x) => a + x.items.filter(i => gearOf(i).cat === 'server').length, 0)} servers · ${P.racks.reduce((a, x) => a + x.cables.length, 0)} cables`),
    el('div', {class: 'chips', style: 'margin-top:8px'}, ...[['cables', 'Show cables'], ['labels', 'Show names']].map(([k, l]) => el('label', {class: 'chip' + (P.rackView[k] ? ' on' : '')}, bind(P.rackView, k, {type: 'checkbox'}), l)))));
  f.append(card('Build a rack', el('div', {class: 'hint', style: 'margin:0'}, ...[
    ['Add a rack', 'pick HPE or Dell at the top of the left panel, then click a rack model'],
    ['Add gear', 'drag a server or switch onto a U slot (front or rear), or click it to fill the next free U from the top'],
    ['Move', 'drag a device up or down; the target U turns green if it fits, red if it’s taken'],
    ['Cable', 'select the rack and press Auto-wire; re-run it whenever you add or move gear'],
    ['Export', 'File → Export SVG / PNG / HTML, or the cable schedule CSV from the rack’s panel']].map(([b, t]) => el('div', {style: 'margin:3px 0'}, el('b', {}, b + ': '), t)))));
  if (P.racks.some(x => x.cables.length)) f.append(card('Outputs', el('p', {class: 'hint'}, 'The wiring diagram is a normal network page drawn from these racks’ cables (TOR ↔ servers, management and uplinks). Re-create it after re-wiring.'),
    el('div', {class: 'btns'}, el('button', {class: 'primary', onclick: makeWiringPage}, 'Create / update wiring diagram page'), el('button', {class: 'mini', onclick: exportCableSchedule}, 'Cable schedule (CSV)'))));
  return f;
}
function exportCableSchedule() { downloadCSV(slug(pg().name) + '-cable-schedule', rackSchedule(pg())); }
function newPageMenu(e) {
  showMenu(e.clientX, e.clientY, [
    {label: 'Network diagram page', fn: () => addPage()},
    {label: 'Rack page (front & rear)', fn: () => addPage(newRackPage('Rack ' + (doc.pages.filter(p => p.kind === 'rack').length + 1)))}
  ]);
}

function makeWiringPage() {
  const rp = pg();
  normRackPage(rp);
  const res = rackAutoWireAll(rp, true);                       /* cable anything added since the last wiring (existing cables keep their ports) */
  const at = doc.pages.findIndex(p => p.wiringOf === rp.id);
  views[rp.id] = view;
  let msg;
  if (at >= 0) {
    const E = doc.pages[at], G = rackWiringPage(doc, rp, E.name, E.wiringOpt || {});
    const m = mergeWiringPage(doc, E, G);
    doc.active = at; msg = `Updated “${E.name}”` + (m.added ? ` · ${m.added} device(s) added` : '') + (m.removed ? ` · ${m.removed} removed` : '') + ` · ${m.links} links`;
  } else {
    const np = rackWiringPage(doc, rp, rp.name + ' — wiring'); np.wiringOf = rp.id;
    doc.pages.splice(doc.active + 1, 0, np); doc.active = doc.active + 1;
    msg = `Created “${np.name}” — ${np.devices.length} devices, ${np.links.length} links`;
  }
  sel = new Set(); view = null; commit(); refresh();
  toast(msg + (res.miss.length ? ' · ' + res.miss.join(' · ') : ''));
}
